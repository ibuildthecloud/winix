[package]
name = "winix-cfg"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
description = "Declarative Windows configuration"
license = "MIT"
repository = "https://github.com/ibuildthecloud/winix"
readme = "README.md"

[features]
default = ["development-paths"]
development-paths = []

[dependencies]
anyhow = "1.0"
base64 = "0.23"
clap = { version = "4.5", features = ["derive"] }
jsonschema = { version = "0.18.3", features = ["draft202012"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
toml = "0.8"
uuid = { version = "1.24", features = ["v4"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_System_RemoteDesktop",
  "Win32_System_Threading",
  "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
tempfile = "3.20"
